    <!--
      ⚡ CRITICAL: Capture beforeinstallprompt BEFORE React mounts.
      Chrome fires this event very early — React's useEffect misses it.
      We store it globally so the modal can use it anytime.
    -->
    <script>
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        // Notify any React listener that might already be mounted
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function() {
        window.__pwaInstallPrompt = null;
        localStorage.setItem('svai_install_done', 'true');
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
